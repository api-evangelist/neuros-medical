aid: neuros-medical
name: Neuros Medical
description: >-
  Neuros Medical is a privately held medical device company headquartered in Arden Hills, Minnesota,
  and the maker of the Altius Direct Electrical Nerve Stimulation System — an implantable, patient-controlled
  high-frequency nerve block indicated as an aid in the management of chronic intractable phantom and residual
  lower limb post-amputation pain in adult amputees. The system pairs a nerve cuff electrode placed around a
  peripheral nerve with an implantable pulse generator and a handheld patient controller, and received FDA
  approval in 2024 after FDA Breakthrough Device Designation and the QUEST pivotal trial. The company sells an
  implantable therapy to health systems, pain physicians and amputees; it operates a marketing and
  patient-education website and publishes no developer program, public API, SDK or machine-readable contract.
